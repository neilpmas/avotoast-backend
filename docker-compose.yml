# Local Postgres for development: `docker compose up -d`.
# Matches src/main/resources/application-local.yml.example (database `template`,
# user `postgres`, password `password`). Local development only -- never reuse these
# credentials anywhere real. Integration tests don't need this: they start their own
# Postgres through Testcontainers.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
