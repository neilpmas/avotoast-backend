spring:
  application:
    name: avotoast-backend
  datasource:
    # JDBC, used only by Flyway for migrations -- the application itself talks R2DBC below.
    # See FlywayConfig for why this has to be wired up by hand.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    pool:
      initial-size: 1
      max-size: 5
  flyway:
    enabled: true
    schemas: app
    default-schema: app
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://test.example.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.test.example.com}

connect:
  # Only the Cloudflare Workers BFF calls this backend's Connect endpoints, and it
  # does so server-to-server — no browser is ever in that request path. CORS exists
  # to govern browser-to-server calls, so there's no legitimate case here for it;
  # leaving it on (the starter's default) just serves permissive headers nobody uses.
  cors-enabled: false

logging:
  # ECS format so `requestId`/`method`/`path`/etc. added via SLF4J's fluent
  # addKeyValue() API land as real JSON fields, not just embedded in the message
  # string. Built into Spring Boot since 3.4 -- no extra dependency needed.
  structured:
    format:
      console: ecs

app:
  environment: ${APP_ENVIRONMENT:local}

grpc:
  server:
    port: 9090
    security:
      enabled: false   # auth is handled at the HTTP layer by the BFF
