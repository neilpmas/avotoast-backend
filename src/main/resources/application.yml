spring:
  application:
    name: avotoast-backend
  datasource:
    # JDBC, used only by Flyway for migrations -- the application itself talks R2DBC below.
    # See FlywayConfig for why this has to be wired up by hand.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    pool:
      initial-size: 1
      max-size: 5
  flyway:
    enabled: true
    schemas: app
    default-schema: app
    create-schemas: true
    # Fly.io and Neon both scale to zero when idle. A cold request can wake the Fly
    # machine before Neon's compute finishes waking, so the first connection attempt
    # can lose the race and fail. Retry for up to ~30s instead of crashing the JVM.
    connect-retries: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://test.example.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.test.example.com}

connect:
  # Only the Cloudflare Workers BFF calls this backend's Connect endpoints, and it
  # does so server-to-server — no browser is ever in that request path. CORS exists
  # to govern browser-to-server calls, so there's no legitimate case here for it;
  # leaving it on (the starter's default) just serves permissive headers nobody uses.
  cors-enabled: false

logging:
  # ECS format so `requestId`/`method`/`path`/etc. added via SLF4J's fluent
  # addKeyValue() API land as real JSON fields, not just embedded in the message
  # string. Built into Spring Boot since 3.4 -- no extra dependency needed.
  structured:
    format:
      console: ecs

sentry:
  # Empty DSN is the SDK's own documented no-op state -- it logs a debug line and
  # sends nothing, rather than failing to start. Safe to leave unset until a
  # Sentry project actually exists; no code change needed to turn it on later.
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENVIRONMENT:local}
  # Error tracking only -- no performance/tracing spans, to stay well within a
  # free-tier event quota. Revisit if latency tracing becomes useful.
  traces-sample-rate: 0.0
  # Request bodies and headers can carry user data -- don't forward that to a
  # third party by default.
  send-default-pii: false

app:
  environment: ${APP_ENVIRONMENT:local}
  migrations:
    # How long MigrationGateWebFilter parks a Connect request that arrives while
    # DatabaseMigrationRunner is still working, before giving up with a 503. Only a
    # backstop in practice: a database that never comes up fails Flyway's own
    # connect-retries (~30s) first, which errors the gate immediately.
    gate-timeout: 60s

grpc:
  server:
    port: 9090
    security:
      enabled: false   # auth is handled at the HTTP layer by the BFF
